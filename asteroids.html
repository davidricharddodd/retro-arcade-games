<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids - Retro Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .game-container {
            text-align: center;
        }
        
        h1 {
            color: #00ffff;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            letter-spacing: 2px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            max-width: 800px;
            margin: 0 auto 1rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .info-item {
            font-size: 1.3rem;
        }
        
        .info-label {
            color: #00ffff;
            font-weight: bold;
            margin-right: 5px;
        }
        
        canvas {
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px #00ffff, inset 0 0 20px rgba(0, 255, 255, 0.1);
            background: #000;
            display: block;
            margin: 0 auto 1rem;
        }
        
        .controls {
            color: #fff;
            margin: 1rem 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .btn {
            background: linear-gradient(135deg, #00ffff 0%, #0088ff 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #00cccc 0%, #0066cc 100%);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }
        
        .game-over {
            display: none;
            color: #ff0055;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0055;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>☄️ ASTEROIDS ☄️</h1>
        <div class="game-info">
            <div class="info-item">
                <span class="info-label">SCORE:</span>
                <span id="score">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">LIVES:</span>
                <span id="lives">🚀🚀🚀</span>
            </div>
            <div class="info-item">
                <span class="info-label">LEVEL:</span>
                <span id="level">1</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="game-over" id="gameOver">GAME OVER!</div>
        <div class="controls">
            ← → : Rotate Ship | ↑ : Thrust | Space : Shoot<br>
            Hyperspace: H (when available)
        </div>
        <button class="btn" onclick="restartGame()">New Game</button>
        <button class="btn" onclick="location.href='index.html'">Back to Menu</button>
    </div>

    <script>
        // Game constants and variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        
        // Game state
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let gameOver = false;
        
        // Player ship
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            rotation: 0, // in radians
            velocityX: 0,
            velocityY: 0,
            thrust: 0.1,
            rotationSpeed: 0.08,
            friction: 0.98,
            radius: 15,
            invincible: false,
            invincibleTimer: 0
        };
        
        // Arrays for game objects
        let bullets = [];
        let asteroids = [];
        let particles = [];
        let saucer = null;         // Flying saucer (large=1000pts, small=200pts in original)
        let saucerTimer = 0;
        let saucerBullets = [];
        let saucerInterval = 600; // frames until next saucer
        
        // Input tracking
        const keys = {};
        
        // Initialize game
        function initGame() {
            score = 0;
            lives = 3;
            level = 1;
            gameRunning = true;
            gameOver = false;
            
            player = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                rotation: 0,
                velocityX: 0,
                velocityY: 0,
                thrust: 0.1,
                rotationSpeed: 0.08,
                friction: 0.98,
                radius: 15,
                invincible: false,
                invincibleTimer: 0
            };
            
            bullets = [];
            asteroids = [];
            particles = [];
            saucer = null; saucerTimer = 0; saucerBullets = [];
            saucerInterval = 600;
            
            // Create initial asteroids
            createAsteroids(4 + level);
            
            updateDisplay();
            gameOverElement.style.display = 'none';
            requestAnimationFrame(gameLoop);
        }
        
        // Pre-compute asteroid polygon vertices (fixes flickering)
        function makeAsteroidVerts(numVerts) {
            const verts = [];
            for (let i = 0; i < numVerts; i++) {
                const angle = (i / numVerts) * Math.PI * 2;
                const r = 0.7 + Math.random() * 0.3; // irregular shape
                verts.push({ cos: Math.cos(angle) * r, sin: Math.sin(angle) * r });
            }
            return verts;
        }

        function makeAsteroid(x, y, vx, vy, size, type) {
            const numVerts = Math.floor(7 + Math.random() * 5);
            return {
                x, y, velocityX: vx, velocityY: vy,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.03,
                size, type,
                verts: makeAsteroidVerts(numVerts)
            };
        }

        // Create asteroids
        function createAsteroids(count) {
            for (let i = 0; i < count; i++) {
                const size = 38 + Math.random() * 18;
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(canvas.width, canvas.height) * 0.6;
                const speed = 0.8 + Math.random() * 1.2;
                asteroids.push(makeAsteroid(
                    canvas.width / 2 + Math.cos(angle) * distance,
                    canvas.height / 2 + Math.sin(angle) * distance,
                    Math.cos(Math.random() * Math.PI * 2) * speed,
                    Math.sin(Math.random() * Math.PI * 2) * speed,
                    size, 'large'
                ));
            }
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            update();
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function update() {
            // Update player
            updatePlayer();
            
            // Update bullets
            updateBullets();
            
            // Update asteroids
            updateAsteroids();
            
            // Update particles
            updateParticles();

            // Update saucer
            updateSaucer();

            // Check collisions
            checkCollisions();

            // Update invincibility timer
            if (player.invincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) {
                    player.invincible = false;
                }
            }

            // Level progression
            if (asteroids.length === 0) {
                level++;
                saucer = null; saucerBullets = [];
                saucerTimer = 0; saucerInterval = Math.max(200, 600 - level * 30);
                createAsteroids(4 + level);
                updateDisplay();
            }
        }
        
        // Update player
        function updatePlayer() {
            // Rotation
            if (keys['ArrowLeft']) player.rotation -= player.rotationSpeed;
            if (keys['ArrowRight']) player.rotation += player.rotationSpeed;
            
            // Thrust
            if (keys['ArrowUp']) {
                player.velocityX += Math.cos(player.rotation) * player.thrust;
                player.velocityY += Math.sin(player.rotation) * player.thrust;
                
                // Create thrust particles
                createParticle(
                    player.x - Math.cos(player.rotation) * player.radius,
                    player.y - Math.sin(player.rotation) * player.radius,
                    -Math.cos(player.rotation) * 2,
                    -Math.sin(player.rotation) * 2,
                    '#00ffff',
                    1,
                    20
                );
            }
            
            // Apply friction
            player.velocityX *= player.friction;
            player.velocityY *= player.friction;
            
            // Update position with screen wrapping
            player.x += player.velocityX;
            player.y += player.velocityY;
            
            // Screen wrapping
            if (player.x < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = 0;
            if (player.y < 0) player.y = canvas.height;
            if (player.y > canvas.height) player.y = 0;
            
            // Hyperspace
            if (keys['h'] || keys['H']) {
                player.x = Math.random() * canvas.width;
                player.y = Math.random() * canvas.height;
                player.velocityX = 0;
                player.velocityY = 0;
                keys['h'] = false;
                keys['H'] = false;
            }
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                
                // Update position
                bullet.x += bullet.velocityX;
                bullet.y += bullet.velocityY;
                bullet.lifetime--;
                
                // Screen wrapping
                if (bullet.x < 0) bullet.x = canvas.width;
                if (bullet.x > canvas.width) bullet.x = 0;
                if (bullet.y < 0) bullet.y = canvas.height;
                if (bullet.y > canvas.height) bullet.y = 0;
                
                // Remove if lifetime expired
                if (bullet.lifetime <= 0) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        // Update asteroids
        function updateAsteroids() {
            for (const asteroid of asteroids) {
                // Update position
                asteroid.x += asteroid.velocityX;
                asteroid.y += asteroid.velocityY;
                asteroid.rotation += asteroid.rotationSpeed;
                
                // Screen wrapping
                if (asteroid.x < 0) asteroid.x = canvas.width;
                if (asteroid.x > canvas.width) asteroid.x = 0;
                if (asteroid.y < 0) asteroid.y = canvas.height;
                if (asteroid.y > canvas.height) asteroid.y = 0;
            }
        }
        
        // Create particle
        function createParticle(x, y, vx, vy, color, size, lifetime) {
            particles.push({
                x, y, velocityX: vx, velocityY: vy,
                color, size, lifetime,
                decay: size / lifetime
            });
        }
        
        // Update particles
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                particle.x += particle.velocityX;
                particle.y += particle.velocityY;
                particle.lifetime--;
                particle.size -= particle.decay;
                
                if (particle.lifetime <= 0 || particle.size <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // Update flying saucer
        function updateSaucer() {
            saucerTimer++;
            if (!saucer && saucerTimer >= saucerInterval) {
                saucerTimer = 0;
                // Alternate large (1000pts) and small (200pts) saucers; higher levels more small
                const isSmall = level > 2 && Math.random() < 0.6;
                const fromLeft = Math.random() < 0.5;
                saucer = {
                    x: fromLeft ? -20 : canvas.width + 20,
                    y: 50 + Math.random() * (canvas.height - 100),
                    vx: fromLeft ? 2.5 : -2.5,
                    vy: 0,
                    size: isSmall ? 12 : 22,
                    points: isSmall ? 1000 : 200,
                    shootTimer: 0,
                    shootInterval: isSmall ? 60 : 90,
                    changeTimer: 0
                };
            }
            if (!saucer) return;

            saucer.x += saucer.vx;
            // Periodically change vertical direction (zigzag)
            saucer.changeTimer++;
            if (saucer.changeTimer > 80) {
                saucer.vy = (Math.random() - 0.5) * 2;
                saucer.changeTimer = 0;
            }
            saucer.y += saucer.vy;
            saucer.y = Math.max(20, Math.min(canvas.height - 20, saucer.y));

            // Remove if off screen
            if (saucer.x < -40 || saucer.x > canvas.width + 40) { saucer = null; saucerBullets = []; return; }

            // Shoot at player
            saucer.shootTimer++;
            if (saucer.shootTimer >= saucer.shootInterval) {
                saucer.shootTimer = 0;
                // Small saucer aims at player; large saucer shoots randomly
                let angle;
                if (saucer.points === 1000) {
                    angle = Math.atan2(player.y - saucer.y, player.x - saucer.x) + (Math.random() - 0.5) * 0.4;
                } else {
                    angle = Math.random() * Math.PI * 2;
                }
                saucerBullets.push({ x: saucer.x, y: saucer.y, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, life: 100 });
            }

            // Update saucer bullets
            for (let i = saucerBullets.length - 1; i >= 0; i--) {
                const b = saucerBullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    saucerBullets.splice(i, 1);
                }
            }
        }

        // Check collisions
        function checkCollisions() {
            // Bullet vs asteroid collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < asteroid.size) {
                        // Collision detected
                        score += asteroid.type === 'large' ? 20 :
                                asteroid.type === 'medium' ? 50 : 100;
                        updateDisplay();
                        
                        // Create explosion particles
                        for (let k = 0; k < 15; k++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 1 + Math.random() * 2;
                            createParticle(
                                asteroid.x,
                                asteroid.y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed,
                                '#ff8800',
                                2 + Math.random() * 3,
                                30 + Math.random() * 30
                            );
                        }
                        
                        // Break asteroid
                        if (asteroid.type === 'large') {
                            for (let k = 0; k < 2; k++) {
                                const spd = 1.2 + Math.random() * 1.2;
                                const ang = Math.random() * Math.PI * 2;
                                asteroids.push(makeAsteroid(asteroid.x, asteroid.y,
                                    asteroid.velocityX + Math.cos(ang) * spd,
                                    asteroid.velocityY + Math.sin(ang) * spd,
                                    asteroid.size * 0.55, 'medium'));
                            }
                        } else if (asteroid.type === 'medium') {
                            for (let k = 0; k < 2; k++) {
                                const spd = 1.8 + Math.random() * 1.5;
                                const ang = Math.random() * Math.PI * 2;
                                asteroids.push(makeAsteroid(asteroid.x, asteroid.y,
                                    asteroid.velocityX + Math.cos(ang) * spd,
                                    asteroid.velocityY + Math.sin(ang) * spd,
                                    asteroid.size * 0.5, 'small'));
                            }
                        }
                        
                        // Remove bullet and asteroid
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        break;
                    }
                }
            }
            
            // Player bullet vs saucer
            if (saucer) {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const dx = bullets[i].x - saucer.x, dy = bullets[i].y - saucer.y;
                    if (Math.sqrt(dx*dx + dy*dy) < saucer.size + 4) {
                        score += saucer.points;
                        updateDisplay();
                        for (let k = 0; k < 20; k++) {
                            const a = Math.random() * Math.PI * 2, spd = 1 + Math.random() * 3;
                            createParticle(saucer.x, saucer.y, Math.cos(a)*spd, Math.sin(a)*spd, '#ff4400', 2+Math.random()*2, 30+Math.random()*20);
                        }
                        bullets.splice(i, 1);
                        saucer = null; saucerBullets = [];
                        break;
                    }
                }
            }

            // Saucer bullet vs player
            if (!player.invincible && saucerBullets.length > 0) {
                for (let i = saucerBullets.length - 1; i >= 0; i--) {
                    const dx = saucerBullets[i].x - player.x, dy = saucerBullets[i].y - player.y;
                    if (Math.sqrt(dx*dx + dy*dy) < player.radius + 4) {
                        saucerBullets.splice(i, 1);
                        lives--;
                        updateDisplay();
                        for (let j = 0; j < 30; j++) {
                            const a = Math.random() * Math.PI * 2, spd = 1 + Math.random() * 3;
                            createParticle(player.x, player.y, Math.cos(a)*spd, Math.sin(a)*spd, '#ff0055', 3+Math.random()*4, 40+Math.random()*40);
                        }
                        player.x = canvas.width/2; player.y = canvas.height/2;
                        player.velocityX = 0; player.velocityY = 0;
                        player.invincible = true; player.invincibleTimer = 150;
                        if (lives <= 0) { gameOver = true; gameRunning = false; gameOverElement.style.display = 'block'; }
                        break;
                    }
                }
            }

            // Player vs asteroid collisions
            if (!player.invincible) {
                for (let i = asteroids.length - 1; i >= 0; i--) {
                    const asteroid = asteroids[i];
                    
                    const dx = player.x - asteroid.x;
                    const dy = player.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < player.radius + asteroid.size) {
                        // Player hit!
                        lives--;
                        updateDisplay();
                        
                        // Create explosion
                        for (let j = 0; j < 30; j++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 1 + Math.random() * 3;
                            createParticle(
                                player.x,
                                player.y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed,
                                '#ff0055',
                                3 + Math.random() * 4,
                                40 + Math.random() * 40
                            );
                        }
                        
                        // Reset player position
                        player.x = canvas.width / 2;
                        player.y = canvas.height / 2;
                        player.velocityX = 0;
                        player.velocityY = 0;
                        player.invincible = true;
                        player.invincibleTimer = 120; // 2 seconds at 60fps
                        
                        // Game over check
                        if (lives <= 0) {
                            gameOver = true;
                            gameRunning = false;
                            gameOverElement.style.display = 'block';
                        }
                        
                        break;
                    }
                }
            }
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            drawStars();
            
            // Draw player
            drawPlayer();
            
            // Draw bullets
            drawBullets();
            
            // Draw asteroids
            drawAsteroids();
            
            // Draw saucer
            drawSaucer();

            // Draw particles
            drawParticles();
        }
        
        // Draw stars in background
        function drawStars() {
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 100; i++) {
                // Use simple math to create consistent stars
                const x = (i * 7.3) % canvas.width;
                const y = (i * 13.7) % canvas.height;
                const size = (i % 3) * 0.5 + 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Draw player ship
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            
            // Draw ship with invincibility flash
            if (!player.invincible || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                
                // Ship triangle
                ctx.beginPath();
                ctx.moveTo(player.radius, 0);
                ctx.lineTo(-player.radius * 0.7, player.radius * 0.7);
                ctx.lineTo(-player.radius * 0.7, -player.radius * 0.7);
                ctx.closePath();
                ctx.fill();
                
                // Ship details
                ctx.fillStyle = '#0088ff';
                ctx.beginPath();
                ctx.arc(-player.radius * 0.3, 0, player.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // Draw bullets
        function drawBullets() {
            ctx.fillStyle = '#ffff00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffff00';
            
            for (const bullet of bullets) {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.shadowBlur = 0;
        }
        
        // Draw asteroids
        function drawAsteroids() {
            for (const asteroid of asteroids) {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(asteroid.rotation);
                
                // Asteroid color based on type
                if (asteroid.type === 'large') {
                    ctx.fillStyle = '#888888';
                } else if (asteroid.type === 'medium') {
                    ctx.fillStyle = '#aaaaaa';
                } else {
                    ctx.fillStyle = '#cccccc';
                }
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = asteroid.type === 'large' ? '#666666' : 
                                 asteroid.type === 'medium' ? '#888888' : '#aaaaaa';
                
                // Draw pre-computed irregular polygon (stable shape each frame)
                ctx.beginPath();
                for (let i = 0; i < asteroid.verts.length; i++) {
                    const v = asteroid.verts[i];
                    const x = v.cos * asteroid.size;
                    const y = v.sin * asteroid.size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke(); // Original asteroids used wireframe (vector display)
                ctx.fill();
                
                ctx.restore();
            }
            ctx.shadowBlur = 0;
        }
        
        // Draw particles
        function drawParticles() {
            for (const particle of particles) {
                ctx.fillStyle = particle.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = particle.color;
                
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        
        // Draw flying saucer
        function drawSaucer() {
            if (!saucer) return;
            const { x, y, size } = saucer;
            ctx.strokeStyle = '#ff4400';
            ctx.fillStyle = '#331100';
            ctx.shadowColor = '#ff4400';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 2;

            // Classic saucer: three ellipses stacked
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.1, size, size * 0.38, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.1, size * 0.65, size * 0.55, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.3, size * 0.28, size * 0.28, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.shadowBlur = 0; ctx.lineWidth = 1;

            // Saucer bullets
            ctx.fillStyle = '#ff8800';
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 6;
            for (const b of saucerBullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // Shoot bullet
        function shoot() {
            if (!gameRunning) return;
            
            bullets.push({
                x: player.x + Math.cos(player.rotation) * player.radius,
                y: player.y + Math.sin(player.rotation) * player.radius,
                velocityX: Math.cos(player.rotation) * 8 + player.velocityX,
                velocityY: Math.sin(player.rotation) * 8 + player.velocityY,
                lifetime: 90 // 1.5 seconds at 60fps
            });
        }
        
        // Update display
        function updateDisplay() {
            scoreElement.textContent = score;
            levelElement.textContent = level;
            
            // Update lives display
            let livesText = '';
            for (let i = 0; i < lives; i++) {
                livesText += '🚀';
            }
            livesElement.textContent = livesText;
        }
        
        // Restart game
        function restartGame() {
            initGame();
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && gameRunning) {
                shoot();
                e.preventDefault();
            }
            
            // Start game on first key press if not running
            if (!gameRunning && !gameOver && (e.key.startsWith('Arrow') || e.key === ' ')) {
                initGame();
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Prevent space bar from scrolling page
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
            }
        });
        
        // Initial draw
        draw();
    </script>
</body>
</html>
